name: ATVSX coexist debug build
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: atvsx-debug-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v6
        with:
          go-version-file: tsbridge/go.mod
          cache-dependency-path: tsbridge/go.sum
      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v4
      - name: Verify source and prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          test -s app/src/main/assets/vscreen-ocr/det.onnx
          test -s app/src/main/assets/vscreen-ocr/rec.onnx
          sha256sum app/src/main/assets/vscreen-ocr/*.onnx
          sdkmanager "platforms;android-36" "build-tools;35.0.0"
          chmod +x gradlew tsbridge/build.sh
      - uses: gradle/actions/setup-gradle@v4
      - name: Run targeted display-health unit tests
        run: ./gradlew --no-daemon --max-workers=2 -Dorg.gradle.jvmargs='-Xmx2g -Dfile.encoding=UTF-8' -Pkotlin.compiler.execution.strategy=in-process :app:testDebugUnitTest --tests 'com.kilon.agentvscreen.core.DisplayHealthGuardTest'
      - name: Stage targeted test artifacts
        if: always()
        shell: bash
        run: |
          set -u
          mkdir -p atvsx-targeted-test-results
          cp -a .atvsx-build/app/test-results/testDebugUnitTest atvsx-targeted-test-results/ 2>/dev/null || true
          cp -a .atvsx-build/app/reports/tests/testDebugUnitTest atvsx-targeted-test-results/ 2>/dev/null || true
          python3 - <<'PYTEST'
          import json, pathlib, xml.etree.ElementTree as ET
          root = pathlib.Path('atvsx-targeted-test-results')
          files = list(root.rglob('TEST-*.xml'))
          suites = [ET.parse(p).getroot() for p in files]
          summary = {'xml_files': len(files), 'tests': sum(int(x.get('tests', 0)) for x in suites), 'failures': sum(int(x.get('failures', 0)) for x in suites), 'errors': sum(int(x.get('errors', 0)) for x in suites), 'skipped': sum(int(x.get('skipped', 0)) for x in suites), 'reports_present': bool(files)}
          (root / 'SUMMARY.json').write_text(json.dumps(summary, indent=2))
          print(json.dumps(summary))
          PYTEST
      - name: Preserve targeted test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ATVSX-targeted-test-results-${{ github.run_number }}
          path: atvsx-targeted-test-results/
          if-no-files-found: error
          retention-days: 14
      - name: Require actual passing JUnit results
        shell: bash
        run: |
          python3 - <<'PYTEST'
          import json
          s = json.load(open('atvsx-targeted-test-results/SUMMARY.json'))
          assert s['reports_present'] and s['tests'] >= 10 and s['failures'] == 0 and s['errors'] == 0 and s['skipped'] == 0, s
          PYTEST
      - name: Build Android arm64 Tailscale helper
        run: sh tsbridge/build.sh
      - name: Assemble coexist debug APK
        run: ./gradlew --no-daemon --max-workers=2 -Dorg.gradle.jvmargs='-Xmx3g -Dfile.encoding=UTF-8' -Pkotlin.compiler.execution.strategy=in-process :app:assembleDebug
      - name: Verify APK identity and signature
        shell: bash
        run: |
          set -euo pipefail
          APK=.atvsx-build/app/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          mkdir -p atvsx-artifacts
          cp "$APK" atvsx-artifacts/ATVSX-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > atvsx-artifacts/apk-badging.txt
          grep -q "package: name='com.kilon.agentvscreen.lab'" atvsx-artifacts/apk-badging.txt
          grep -q "application-label:'ATVSX'" atvsx-artifacts/apk-badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK" > atvsx-artifacts/signature-verification.txt
          git rev-parse HEAD > atvsx-artifacts/source-commit.txt
          sha256sum atvsx-artifacts/ATVSX-debug.apk > atvsx-artifacts/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ATVSX-debug-${{ github.run_number }}
          path: atvsx-artifacts/
          if-no-files-found: error
          retention-days: 14
