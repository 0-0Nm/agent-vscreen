name: ATVSX coexist debug build
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: atvsx-debug-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v6
        with:
          go-version-file: tsbridge/go.mod
          cache-dependency-path: tsbridge/go.sum
      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v4
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Verify source and prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          test -s app/src/main/assets/vscreen-ocr/det.onnx
          test -s app/src/main/assets/vscreen-ocr/rec.onnx
          sha256sum app/src/main/assets/vscreen-ocr/*.onnx
          sdkmanager "platforms;android-36" "build-tools;35.0.0"
          chmod +x gradlew tsbridge/build.sh
          test -n "$(curl --fail --silent --show-error --location --max-time 30 https://services.gradle.org/distributions/gradle-8.11.1-bin.zip.sha256)"
      - name: Run targeted display-health unit tests
        run: ./gradlew --no-daemon --max-workers=2 -Dorg.gradle.jvmargs='-Xmx2g -Dfile.encoding=UTF-8' -Pkotlin.compiler.execution.strategy=in-process :app:testDebugUnitTest --tests 'com.kilon.agentvscreen.core.DisplayHealthGuardTest' --tests 'com.kilon.agentvscreen.cmd.ScopedDumpTest' --tests 'com.kilon.agentvscreen.cmd.VScreenV49Test.dumpIsARealHandlerRouteNotJustHelp'
      - name: Stage targeted test artifacts
        if: always()
        shell: bash
        run: |
          set -u
          mkdir -p atvsx-targeted-test-results
          XML_DIR=.atvsx-build/app/test-results/testDebugUnitTest
          REPORT_DIR=.atvsx-build/app/reports/tests/testDebugUnitTest
          if [ -d "$XML_DIR" ]; then cp -a "$XML_DIR" atvsx-targeted-test-results/test-results; fi
          if [ -d "$REPORT_DIR" ]; then cp -a "$REPORT_DIR" atvsx-targeted-test-results/reports; fi
          python3 - <<'PY'
          import glob, os, xml.etree.ElementTree as ET
          xmls = sorted(glob.glob('.atvsx-build/app/test-results/testDebugUnitTest/**/*.xml', recursive=True))
          tests = failures = skipped = 0
          for path in xmls:
              root = ET.parse(path).getroot()
              nodes = [root] if root.tag == 'testsuite' else list(root)
              for suite in nodes:
                  tests += int(suite.attrib.get('tests', '0'))
                  failures += int(suite.attrib.get('failures', '0')) + int(suite.attrib.get('errors', '0'))
                  skipped += int(suite.attrib.get('skipped', '0'))
          with open('atvsx-targeted-test-results/summary.txt', 'w') as f:
              f.write(f'xml_files={len(xmls)}\ntests={tests}\nfailures={failures}\nskipped={skipped}\n')
          if not xmls:
              print('No Gradle XML/report files were produced')
          else:
              print(f'JUnit XML files: {len(xmls)}; tests={tests}; failures={failures}; skipped={skipped}')
          PY
      - name: Preserve targeted test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ATVSX-targeted-test-results-${{ github.run_number }}
          path: atvsx-targeted-test-results/
          if-no-files-found: error
          retention-days: 14
      - name: Build Android arm64 Tailscale helper
        run: sh tsbridge/build.sh
      - name: Assemble coexist debug APK
        run: ./gradlew --no-daemon --max-workers=2 -Dorg.gradle.jvmargs='-Xmx3g -Dfile.encoding=UTF-8' -Pkotlin.compiler.execution.strategy=in-process :app:assembleDebug
      - name: Verify APK identity and signature
        shell: bash
        run: |
          set -euo pipefail
          APK=.atvsx-build/app/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          mkdir -p atvsx-artifacts
          cp "$APK" atvsx-artifacts/ATVSX-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > atvsx-artifacts/apk-badging.txt
          grep -q "package: name='com.kilon.agentvscreen.lab'" atvsx-artifacts/apk-badging.txt
          grep -q "application-label:'ATVSX'" atvsx-artifacts/apk-badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK" > atvsx-artifacts/signature-verification.txt
          git rev-parse HEAD > atvsx-artifacts/source-commit.txt
          sha256sum atvsx-artifacts/ATVSX-debug.apk > atvsx-artifacts/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ATVSX-debug-${{ github.run_number }}
          path: atvsx-artifacts/
          if-no-files-found: error
          retention-days: 14
