name: ATVSX coexist debug build
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: atvsx-debug-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v6
        with:
          go-version-file: tsbridge/go.mod
          cache-dependency-path: tsbridge/go.sum
      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v4
      - name: Verify source and prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          test -s app/src/main/assets/vscreen-ocr/det.onnx
          test -s app/src/main/assets/vscreen-ocr/rec.onnx
          sha256sum app/src/main/assets/vscreen-ocr/*.onnx
          sdkmanager "platforms;android-36" "build-tools;35.0.0"
          chmod +x gradlew tsbridge/build.sh
      - name: Restore verified Gradle distribution
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/atvsx-gradle
          key: atvsx-gradle-8.11.1-f397b287023acdba1e9f6fc5ea72d22dd63669d59ed4a289a29b1a76eee151c6
      - name: Fetch and verify Gradle on cloud runner
        shell: bash
        run: |
          set -euo pipefail
          DIR="$RUNNER_TEMP/atvsx-gradle"
          mkdir -p "$DIR"
          ZIP="$DIR/gradle-8.11.1-bin.zip"
          EXPECTED="f397b287023acdba1e9f6fc5ea72d22dd63669d59ed4a289a29b1a76eee151c6"
          valid() { test -f "$ZIP" && printf '%s  %s\n' "$EXPECTED" "$ZIP" | sha256sum -c - >/dev/null 2>&1; }
          if ! valid; then
            for URL in \
              'https://github.com/gradle/gradle-distributions/releases/download/v8.11.1/gradle-8.11.1-bin.zip' \
              'https://gh-proxy.com/https://github.com/gradle/gradle-distributions/releases/download/v8.11.1/gradle-8.11.1-bin.zip' \
              'https://gh-proxy.org/https://github.com/gradle/gradle-distributions/releases/download/v8.11.1/gradle-8.11.1-bin.zip'; do
              echo "Testing Gradle route: $URL"
              if curl --fail --location --connect-timeout 15 --max-time 180 --retry 1 --retry-delay 2 "$URL" -o "$ZIP.partial"; then
                if printf '%s  %s\n' "$EXPECTED" "$ZIP.partial" | sha256sum -c -; then
                  mv "$ZIP.partial" "$ZIP"
                  break
                fi
              fi
            done
          fi
          valid || { echo 'No route delivered the official Gradle distribution'; exit 1; }
          unzip -tq "$ZIP"
          unzip -oq "$ZIP" -d "$DIR"
          echo "$DIR/gradle-8.11.1/bin" >> "$GITHUB_PATH"
          "$DIR/gradle-8.11.1/bin/gradle" --version
      - uses: gradle/actions/setup-gradle@v4
      - name: Run targeted display-health unit tests
        run: gradle --no-daemon --max-workers=2 -Dorg.gradle.jvmargs='-Xmx2g -Dfile.encoding=UTF-8' -Pkotlin.compiler.execution.strategy=in-process :app:testDebugUnitTest --tests 'com.kilon.agentvscreen.core.DisplayHealthGuardTest' --tests 'com.kilon.agentvscreen.core.VScreenPowerPolicyTest' --tests 'com.kilon.agentvscreen.cmd.ScopedDumpTest' --tests 'com.kilon.agentvscreen.cmd.VScreenV49Test' --tests 'com.kilon.agentvscreen.cmd.VScreenV49Test.dumpIsARealHandlerRouteNotJustHelp' --tests 'com.kilon.agentvscreen.core.VScreenDisplayServiceProtocolTest'
      - name: Stage targeted test artifacts
        if: always()
        shell: bash
        run: |
          set -u
          mkdir -p atvsx-targeted-test-results
          cp -a .atvsx-build/app/test-results/testDebugUnitTest atvsx-targeted-test-results/ 2>/dev/null || true
          cp -a .atvsx-build/app/reports/tests/testDebugUnitTest atvsx-targeted-test-results/ 2>/dev/null || true
          python3 - <<'PYTEST'
          import json, pathlib, xml.etree.ElementTree as ET
          root = pathlib.Path('atvsx-targeted-test-results')
          files = list(root.rglob('TEST-*.xml'))
          suites = [ET.parse(p).getroot() for p in files]
          summary = {'xml_files': len(files), 'tests': sum(int(x.get('tests', 0)) for x in suites), 'failures': sum(int(x.get('failures', 0)) for x in suites), 'errors': sum(int(x.get('errors', 0)) for x in suites), 'skipped': sum(int(x.get('skipped', 0)) for x in suites), 'reports_present': bool(files)}
          (root / 'SUMMARY.json').write_text(json.dumps(summary, indent=2))
          print(json.dumps(summary))
          PYTEST
      - name: Preserve targeted test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ATVSX-targeted-test-results-${{ github.run_number }}
          path: atvsx-targeted-test-results/
          if-no-files-found: error
          retention-days: 14
      - name: Require actual passing JUnit results
        shell: bash
        run: |
          python3 - <<'PYTEST'
          import json
          s = json.load(open('atvsx-targeted-test-results/SUMMARY.json'))
          assert s['reports_present'] and s['tests'] >= 10 and s['failures'] == 0 and s['errors'] == 0 and s['skipped'] == 0, s
          PYTEST
      - name: Build Android arm64 Tailscale helper
        run: sh tsbridge/build.sh
      - name: Assemble APK with mandatory ATVSX long-term signing
        shell: bash
        env:
          ATVSX_SIGNING_KEYSTORE_BASE64: ${{ secrets.ATVSX_SIGNING_KEYSTORE_BASE64 }}
          ATVSX_SIGNING_STORE_PASSWORD: ${{ secrets.ATVSX_SIGNING_STORE_PASSWORD }}
          ATVSX_SIGNING_KEY_PASSWORD: ${{ secrets.ATVSX_SIGNING_KEY_PASSWORD }}
          ATVSX_SIGNING_KEY_ALIAS: ${{ secrets.ATVSX_SIGNING_KEY_ALIAS }}
          ATVSX_SIGNING_STORE_FILE: ${{ runner.temp }}/atvsx-signing/atvsx-release.p12
          ATVSX_REQUIRE_FIXED_SIGNING: 'true'
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PYSIGN'
          import os, pathlib, base64, binascii
          value = os.environ.get('ATVSX_SIGNING_KEYSTORE_BASE64', '')
          if not value:
              raise SystemExit('ATVSX signing secret is missing')
          try:
              raw = base64.b64decode(value, validate=True)
          except binascii.Error:
              raise SystemExit('ATVSX signing secret is invalid') from None
          if not raw:
              raise SystemExit('ATVSX signing keystore is empty')
          dest = pathlib.Path(os.environ['ATVSX_SIGNING_STORE_FILE'])
          dest.parent.mkdir(mode=0o700, parents=True, exist_ok=True)
          with dest.open('xb') as f:
              f.write(raw)
          dest.chmod(0o600)
          PYSIGN
          gradle --no-daemon --max-workers=2 -Dorg.gradle.jvmargs='-Xmx3g -Dfile.encoding=UTF-8' -Pkotlin.compiler.execution.strategy=in-process :app:assembleDebug
      - name: Remove ephemeral signing material
        if: always()
        shell: bash
        run: |
          python3 - <<'PYSIGN'
          import os, pathlib
          p = pathlib.Path(os.environ['RUNNER_TEMP']) / 'atvsx-signing' / 'atvsx-release.p12'
          p.unlink(missing_ok=True)
          if p.parent.is_dir():
              p.parent.rmdir()
          PYSIGN
      - name: Verify APK identity and signature
        shell: bash
        run: |
          set -euo pipefail
          APK=.atvsx-build/app/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          mkdir -p atvsx-artifacts
          cp "$APK" atvsx-artifacts/ATVSX-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > atvsx-artifacts/apk-badging.txt
          grep -q "package: name='com.kilon.agentvscreen.lab'" atvsx-artifacts/apk-badging.txt
          grep -q "application-label:'ATVSX'" atvsx-artifacts/apk-badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" > atvsx-artifacts/signature-verification.txt
          python3 - <<'PYCERT'
          import pathlib, re
          expected = 'b0a09b4abb0df7196d83b83ed158c909771ae562fe28b55abdcae21938fc9900'
          report = pathlib.Path('atvsx-artifacts/signature-verification.txt').read_text()
          found = re.findall(r'Signer #\d+ certificate SHA-256 digest: ([0-9a-fA-F:]+)', report)
          assert len(found) == 1 and found[0].replace(':', '').lower() == expected, 'APK is not signed by the ATVSX long-term certificate'
          pathlib.Path('atvsx-artifacts/signing-certificate-sha256.txt').write_text(expected + '\n')
          print('ATVSX long-term signing certificate verified')
          PYCERT
          git rev-parse HEAD > atvsx-artifacts/source-commit.txt
          sha256sum atvsx-artifacts/ATVSX-debug.apk > atvsx-artifacts/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ATVSX-debug-${{ github.run_number }}
          path: atvsx-artifacts/
          if-no-files-found: error
          retention-days: 14

